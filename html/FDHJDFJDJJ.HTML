<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Cards</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }
        body{
            min-height:700px; /* replaced vh with px */
            display:flex;
            justify-content:center;
            align-items:center;
            background:#d9d5d5;
        }
        .outer-box{
            width:90%;
            border:2px solid black;
            padding:30px;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .card-wrapper{
            width:100%;
            display:flex;
            justify-content:space-evenly;
            align-items:center;
            gap:20px;
        }
        .card{
            width:260px;
            padding:25px 15px 30px;
            background:#d1eaeb;
            border-radius:10px;
            box-shadow:0 4px 15px black;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
        }
        .circle{
            width:80px;
            height:80px;
            border-radius:50%;
            background: blue;
            display:flex;
            justify-content:center;
            align-items:center;
            color: white;
            font-weight:bold;
            font-size:22px;
            margin-bottom:15px;
        }
        .name{
            font-weight:bold;
            margin-bottom:8px;
        }
        .line{
            font-size:14px;
            margin-bottom:3px;
        }
    </style>
</head>
<body>
<div class="outer-box">
    <div class="card-wrapper">

        <div class="card">
            <div class="circle">RV</div>
            <div class="name">Royal Vshishtha</div>
            <div class="line">B.Tech - AIML</div>
            <div class="line">Roll No: 2025B15310193</div>
            <div class="line">1st Year</div>
        </div>

        <div class="card">
            <div class="circle">RV</div>
            <div class="name">Roy Vardhan</div>
            <div class="line">B.Tech - CSE</div>
            <div class="line">Roll No: 2025B15310117</div>
            <div class="line">1st Year</div>
        </div>

        

    </div>
</body>
</html>
