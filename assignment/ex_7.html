<!DOCTYPE html>
<html>
<head>
    <title>Navigation Menu Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        
        h1 {
            display: block; 
            background-color: lightblue;
            padding: 10px;
        }

        
        .nav {
            background-color: #333;
            overflow: hidden; 
        }

        
        .nav a {
            display: inline-block;
            color: white;
            padding: 14px 20px;
            text-decoration: none;
        }

        
        .inline-text span {
            display: inline; 
            background-color: yellow;
            padding: 5px;
        }

        
        .left-box {
            width: 200px;
            height: 100px;
            background-color: lightgreen;
            float: left;
            margin-right: 10px;
        }

        .right-content {
            background-color: lightgray;
            padding: 10px;
        }

        
        .clear-section {
            clear: both; 
            background-color: pink;
            padding: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Navigation Menu Demo</h1>

    <!-- Navigation Menu -->
    <div class="nav">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>

    <h2>Inline Example</h2>
    <div class="inline-text">
        <span>This</span>
        <span>is</span>
        <span>inline</span>
        <span>text</span>
    </div>

    <h2>Float & Clear Example</h2>
    <div class="left-box">Floating Box</div>
    <div class="right-content">
        This text wraps around the floating box. Float example shown here.
    </div>

    <div class="clear-section">Clear applied here. Float effect ends.</div>

</body>
