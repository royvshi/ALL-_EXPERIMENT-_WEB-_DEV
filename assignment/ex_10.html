<!DOCTYPE html>
<html>
<head>
    <title>ShopEase</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
        }
        .navbar{
            background:#1c1c1c;
            color:#fff;
            padding:12px 25px;
            display:flex;
            align-items:center;
        }
        .logo{
            font-size:20px;
            font-weight:bold;
        }
        .menu{
            margin:0;
            padding:0;
            list-style:none;
            display:flex;
            justify-content:center;
            flex:1;
        }
        .menu li{
            margin:0 18px;
            font-size:14px;
        }
        .menu a,
        .right a{
            text-decoration:none;
            color:#fff;
        }
        .right{
            font-size:14px;
            white-space:nowrap;
        }
        .right a{
            margin-left:15px;
        }
        .content{
            padding:15px 18px;
        }
        .content h2{
            margin:0;
            font-size:20px;
        }
        .content p{
            margin-top:4px;
            font-size:12px;
        }

        @media (max-width:700px){
            .navbar{
                flex-wrap:wrap;
            }
            .menu{
                width:100%;
                justify-content:flex-start;
                margin-top:8px;
                flex-wrap:wrap;
            }
            .menu li{
                margin:4px 12px 4px 0;
            }
            .right{
                margin-left:auto;
                font-size:12px;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">ShopEase</div>
    <ul class="menu">
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Categories</a></li>
        <li><a href="#">Deals</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
    <div class="right">
        <a href="#">Cart 🛒</a>
        <a href="#">Login</a>
    </div>
</div>

<div class="content">
    <h2>Welcome to ShopEase!</h2>
    <p>Your one-stop destination for all shopping needs.</p>
</div>

</body>
</html>
