<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;

            background: linear-gradient(to bottom right, #7b7284, #5694ff);

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background-color: white;
            width: 320px;
            padding: 20px;
            border-radius: 15px;

            box-shadow: 0 0 20px rgba(0,0,0,0.3);

            display: flex;
            flex-direction: column;
            align-items: center;

            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
        }

        .card img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 4px solid #2575fc;
        }

        .card h2 {
            margin: 5px 0;
            color: #333;
        }

        .subtitle {
            color: #666;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .info {
            margin-top: 10px;
            width: 100%;
        }

        .info p {
            margin: 8px 0;
            font-size: 15px;
            color: #333;
            background: #eef2ff;
            padding: 6px;
            border-radius: 5px;
        }

        .info strong {
            color: #2575fc;
        }
    </style>
</head>

<body>

    <div class="card">
        <img src="roypassportphoto.jpg" alt="Student Photo">

        <h2>Royal Vshishtha</h2>
        <p class="subtitle">B.Tech Student</p>

        <div class="info">
            <p><strong>Roll No:</strong> 2025b15310193</p>
            <p><strong>Department:</strong> CSE AIML</p>
            <p><strong>Year:</strong> 1st Year</p>
            <p><strong>Email:</strong> royalvshishtha123@gmail.com</p>
        </div>
    </div>

</body>
</html>
