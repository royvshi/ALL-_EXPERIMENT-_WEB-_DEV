<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4x4 Color Grid Table</title>
  <style>
    table {
      border-collapse: collapse;
      width: 400px;
      height: 400px;
      margin: 20px auto;
    }
    
    td {
      border: 2px solid #000;
      width: 25%;
      height: 25%;
      text-align: center;
      font-weight: bold;
      color: white;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
 <h1  style="background-color: White;">
    Welcome To The Matrix Show
  </h1>

<body  style="background-color: rgb(132, 56, 56);" >
 

  <table>
    <tr>
      <td style="background-color: red;">Red</td>
      <td style="background-color: orange;">Orange</td>
      <td style="background-color: yellow; color: black;">Yellow</td>
      <td style="background-color: green;">Green</td>
    </tr>
    <tr>
      <td style="background-color: blue;">Blue</td>
      <td style="background-color: indigo;">Indigo</td>
      <td style="background-color: violet;">Violet</td>
      <td style="background-color: pink; color: black;">Pink</td>
    </tr>
    <tr>
      <td style="background-color: brown;">Brown</td>
      <td style="background-color: gray;">Gray</td>
      <td style="background-color: teal;">Teal</td>
      <td style="background-color: gold; color: black;">Gold</td>
    </tr>
    <tr>
      <td style="background-color: crimson;">Crimson</td>
      <td style="background-color: lime; color: black;">Lime</td>
      <td style="background-color: navy;">Navy</td>
      <td style="background-color: coral;">Coral</td>
    </tr>
  </table>
  By-Royal Vshishtha
</body>
</html>
