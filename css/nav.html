<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>ABES Style Navbar</title>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="123.png.avif" alt="College Logo">
            <div class="text">
                <h2>ABES</h2>
                <p>Engineering College</p>
            </div>
        </div>

        <nav class="menu">
            <ul>
                <li><a href="#">About</a></li>
                <li><a href="#">Admissions</a></li>
                <li><a href="#">Academics</a></li>
                <li><a href="#">Clubs</a></li>
                <li><a href="#">Campus</a></li>
                <li><a href="#">Placements</a></li>
                <li><a href="#">Research</a></li>
                <li><a href="#">Entrepreneurship</a></li>
            </ul>
        </nav>
    </header>

</body>
</html>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

.navbar{
    background: black;
    display: flex;
    align-items: center;
    padding: 10px 40px;
    justify-content: space-between;
}

.logo{
    display: flex;
    align-items: center;
    color: white;
}

.logo img{
    width: 70px;
    margin-right: 10px;
}

.logo h2{
    margin: 0;
    font-size: 28px;
}

.logo p{
    font-size: 12px;
    margin-top: -5px;
}

.menu ul{
    display: flex;
    list-style: none;
}

.menu ul li{
    margin: 0 18px;
}

.menu ul li a{
    text-decoration: none;
    color: white;
    font-size: 18px;
    font-weight: 500;
    transition: 0.3s;
}

.menu ul li a:hover{
    color: rgb(200,200,200);
}
</style>
